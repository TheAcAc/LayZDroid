name: Build LayZDroid preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {}
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run policy and layout checks
        run: |
          dotnet run --project Checks/LayZDroid/Checks.csproj -c Release
          if ($LASTEXITCODE) { throw 'LayZDroid policy checks failed' }
          dotnet run --project Checks/LayZDroidUi/Checks.csproj -c Release
          if ($LASTEXITCODE) { throw 'LayZDroid layout/ownership checks failed' }
      - name: Publish standalone Windows executable
        run: |
          dotnet publish Tools/LayZDroid/LayZDroid.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          if ($LASTEXITCODE) { throw 'LayZDroid publish failed' }
          Copy-Item LICENSE,README.md,DOTNET-NOTICES.txt,DOTNET-LICENSE.txt,DOTNET-DESKTOP-LICENSE.txt publish/
          $hash = (Get-FileHash -Algorithm SHA256 publish/LayZDroid.exe).Hash.ToLowerInvariant()
          "$hash  LayZDroid.exe" | Set-Content publish/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: LayZDroid-Windows
          path: |
            publish/LayZDroid.exe
            publish/SHA256SUMS.txt
            publish/LICENSE
            publish/README.md
            publish/DOTNET-*.txt
      - name: Publish preview release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: LayZDroid 0.1.0 Preview 3
          prerelease: true
          body_path: CHANGES-0.1.0-preview.3.md
          files: |
            publish/LayZDroid.exe
            publish/SHA256SUMS.txt
            publish/LICENSE
            publish/README.md
            publish/DOTNET-*.txt
